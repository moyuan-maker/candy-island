<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>口语糖果岛</title>
<meta name="theme-color" content="#ffb3d1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--ink:#4a2c45;--ink2:#7a5d77;--cream:#fffaf3;--pink:#ff7eb3;--pink-d:#e0558f;--peach:#ffb38a;--lilac:#b99bff;--lilac-d:#8b6ae0;--mint:#6fd8a0;--mint-d:#3fb878;--sky:#7fd0ff;--yellow:#ffd54f;--red:#ff6b6b;
 --d:'ZCOOL KuaiLe','Baloo 2','PingFang SC','Microsoft YaHei',sans-serif;--n:'Baloo 2','PingFang SC',sans-serif;--b:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--b);color:var(--ink);background:linear-gradient(180deg,#ffd6e8 0%,#ffe9d6 40%,#e8f6ff 100%) fixed;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px}
.disp{font-family:var(--d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--d);font-size:20px;padding:13px 22px;border-radius:20px;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:linear-gradient(180deg,#ff9fc6,var(--pink));color:#fff;text-shadow:0 2px 0 var(--pink-d)}
.btn.mint{background:linear-gradient(180deg,#9ff0c4,var(--mint));color:#fff;text-shadow:0 2px 0 var(--mint-d)}
.btn.lilac{background:linear-gradient(180deg,#d6c4ff,var(--lilac));color:#fff;text-shadow:0 2px 0 var(--lilac-d)}
.btn.yellow{background:linear-gradient(180deg,#ffe58a,var(--yellow))}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.small{font-size:13px;color:var(--ink2)}
.squish{animation:squish .32s}
@keyframes squish{30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.06)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.bob{animation:bob 1.6s ease-in-out infinite}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:12px 14px;background:linear-gradient(180deg,#ffd6e8ee,#ffd6e800)}
.top .chip{font-family:var(--n);font-size:16px}
.top .sp{flex:1}
.goal{margin:4px 16px 0;display:flex;gap:12px;align-items:center}
.goal .bar{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.goal .fill{height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,#ff9fc6 10px 20px);border-radius:999px;transition:width .6s}
.hello{display:flex;gap:10px;align-items:center;margin:10px 16px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:15px;line-height:1.5;font-weight:600}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;border:9px solid transparent;border-right-color:var(--ink)}
.bubble:after{content:"";position:absolute;left:-7px;top:24px;border:7px solid transparent;border-right-color:#fff}

/* fortune cookie */
.cookie{margin:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer}
.cookie .ic{font-size:46px;transition:transform .3s}
.cookie.open .ic{transform:rotate(-18deg) scale(1.1)}
.cookie h4{margin:0 0 4px;font-family:var(--d);font-size:19px;font-weight:400}
.cookie p{margin:0;font-size:14px;line-height:1.6}

/* map */
.stagehead{margin:26px 16px 6px;padding:14px 16px;border-radius:24px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:#fff;position:relative;overflow:hidden}
.stagehead h3{margin:0;font-family:var(--d);font-weight:400;font-size:24px;text-shadow:0 2px 0 #0003}
.stagehead .en{font-family:var(--n);font-size:13px;opacity:.9}
.stagehead .ab{margin-top:8px;background:#ffffffe6;color:var(--ink);border-radius:14px;padding:7px 10px;font-size:13px;font-weight:700}
.stagehead .big{position:absolute;right:10px;top:4px;font-size:58px;opacity:.95}
.path{position:relative;margin:0 16px}
.path>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:66px;height:66px;border-radius:50%;border:3.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--n);font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 #0004}
.node.lock{background:#e6dfe8!important;color:#b5a7b5;text-shadow:none;box-shadow:0 5px 0 #b5a7b5;border-color:#b5a7b5}
.node.boss{width:80px;height:80px;font-size:38px;border-radius:26px}
.node .st{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:-2px;white-space:nowrap;text-shadow:none}
.node.cur:after{content:"";position:absolute;inset:-12px;border-radius:inherit;border:4px solid #fff;animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
.here{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:3}
.here .tag{font-family:var(--d);background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:2px 10px;font-size:16px;margin-bottom:-6px;z-index:2}
.finale{margin:30px 16px 10px;text-align:center}
.finale h3{font-family:var(--d);font-weight:400;font-size:24px;margin:6px 0}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(452px,calc(100% - 28px));display:flex;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);z-index:30;padding:5px}
.tabs button{flex:1;padding:8px 0;border-radius:18px;font-family:var(--d);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button i{font-style:normal;font-size:22px}
.tabs button.on{background:#ffe1ee}

/* future page */
.sec{margin:18px 16px}
.sec h2{font-family:var(--d);font-weight:400;font-size:26px;margin:0 0 10px;line-height:1.3}
.postcard{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.postcard .em{font-size:34px;flex:none;width:52px;height:52px;border-radius:16px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.postcard b{display:block;font-size:16px;margin-bottom:2px}
.postcard span{font-size:14px;color:var(--ink2);line-height:1.55}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .card{padding:14px}
.vs h4{margin:0 0 8px;font-family:var(--d);font-weight:400;font-size:18px}
.vs ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed #c9b8c9;display:flex;align-items:center;justify-content:center;font-size:28px;filter:grayscale(1);opacity:.45;position:relative}
.stamp.on{border:3px solid var(--pink-d);filter:none;opacity:1;background:#fff;transform:rotate(-8deg);box-shadow:0 0 0 4px #ffd1e4}
.coverwrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.coverwrap canvas{display:block;width:100%}
.coverwrap .lockv{position:absolute;inset:0;background:#ffffff8c;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--d);font-size:20px;text-align:center;gap:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px}
.badge .e{font-size:36px}
.badge b{display:block;font-size:14px;margin-top:4px}
.badge.off{filter:grayscale(1);opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--n);font-size:28px;color:var(--pink-d)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#ffe1ee,#fff6ea 50%,#e9f7ff);overflow-y:auto}
.ov .in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 24px}
.lhead{display:flex;align-items:center;gap:10px}
.lhead .x{font-size:26px;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.pbar{flex:1;height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.pbar div{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--mint) 0 10px,#9ff0c4 10px 20px);transition:width .4s}
.combo{font-family:var(--d);background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:2px 10px;font-size:16px;animation:pop .35s}
.coach{display:flex;align-items:flex-start;gap:6px;margin:14px 0 10px}
.coach .m{flex:none;width:76px}
.coach .bubble{flex:1;margin-left:10px;font-size:16px}
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.scene{align-self:flex-start;background:#fff3c9}
.en{font-family:var(--n);font-weight:700;font-size:30px;line-height:1.3;word-break:break-word}
.en.long{font-size:24px}
.zh{font-size:17px;font-weight:600;color:var(--ink2);margin-top:6px}
.w{border-radius:8px;padding:0 2px;cursor:pointer;transition:background .15s}
.w.g{border-bottom:3px dotted var(--lilac)}
.w.say{background:var(--yellow)}
.w.ok{color:#1fa463;background:#dcf8e8}
.w.miss{color:#e5484d;background:#ffe3e3;text-decoration:underline wavy #e5484d55}
.ex{background:#fff;border:2.5px dashed #e3cfe0;border-radius:18px;padding:10px 12px;font-size:15px;line-height:1.6}
.ex .e{font-family:var(--n);font-weight:600;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.play{width:56px;height:56px;border-radius:50%;font-size:24px;padding:0}
.mic{width:96px;height:96px;border-radius:50%;font-size:40px;padding:0;margin:0 auto;position:relative}
.mic.rec{background:linear-gradient(180deg,#ff9b9b,var(--red))}
.mic.rec:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--red);animation:ring 1.1s infinite}
.miclabel{text-align:center;font-family:var(--d);font-size:17px;margin-top:6px}
.scorebox{display:flex;align-items:center;gap:14px;animation:pop .4s}
.scorebox .num{font-family:var(--n);font-weight:800;font-size:46px;line-height:1;color:var(--pink-d)}
.scorebox .t{font-family:var(--d);font-size:24px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{text-align:left;font-size:18px;font-weight:700;font-family:var(--b);justify-content:flex-start;padding:16px 18px}
.opt.right{background:#dcf8e8;border-color:#1fa463;box-shadow:0 5px 0 #1fa463}
.opt.wrong{background:#ffe3e3;border-color:#e5484d;box-shadow:0 5px 0 #e5484d}
.slots{min-height:66px;border-bottom:3px dashed #d8c3d6;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.tile{font-family:var(--n);font-weight:700;font-size:19px;padding:9px 14px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.tile.used{visibility:hidden}
.tile.boom{animation:boom .45s forwards}
@keyframes boom{40%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(0);opacity:0}}
.c0{background:#ffc2da}.c1{background:#ffd9a8}.c2{background:#bfe6ff}.c3{background:#c8f2d8}.c4{background:#e1d3ff}.c5{background:#fff0a8}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--pink);text-align:center;color:var(--pink-d);margin:0 4px}
.mood{text-align:center;padding:16px}
.mood .e{font-size:64px;animation:bob 1.4s infinite ease-in-out;display:inline-block}
.mood .t{font-family:var(--d);font-size:26px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gem{min-height:78px;border-radius:22px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:700;font-size:15px;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;transition:transform .15s}
.gem.en{font-family:var(--n);font-size:16px}
.gem.sel{transform:translateY(-6px) scale(1.06);box-shadow:0 10px 0 var(--ink);outline:4px solid #fff}
.gem.gone{animation:boom .45s forwards;pointer-events:none}
.timer{height:14px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.timer div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--peach));transition:width 1s linear}
.foot{margin-top:14px;padding-bottom:6px}
.fb{border-radius:22px;padding:14px 16px;border:3px solid var(--ink);margin-bottom:12px;animation:pop .3s}
.fb.ok{background:#dcf8e8}
.fb.no{background:#fff1d6}
.fb b{font-family:var(--d);font-size:22px;font-weight:400;display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.sheet.on{transform:none}
.sheet .card{max-width:480px;margin:0 auto;border-radius:28px 28px 0 0;padding:22px 20px 30px;box-shadow:0 -6px 0 var(--ink)}
.sheet .wd{font-family:var(--n);font-weight:800;font-size:34px}
.sheet .ipa{font-family:var(--n);color:var(--lilac-d);font-size:20px}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:90;font-family:var(--d);font-size:46px;color:#fff;text-shadow:0 4px 0 var(--pink-d),3px 3px 0 var(--pink-d),-3px 3px 0 var(--pink-d);pointer-events:none;animation:praise 1.2s forwards;white-space:nowrap}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-90%);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:99;transition:.3s;font-size:14px;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.bigstars{font-size:58px;letter-spacing:6px;text-align:center}
.bigstars span{display:inline-block;animation:pop .5s backwards;filter:drop-shadow(0 4px 0 #c99400)}
.bigstars span.off{filter:grayscale(1);opacity:.3}
.gain{display:flex;gap:12px;align-items:center;margin-top:10px;animation:pop .5s backwards}
.gain .e{font-size:40px}
.center{text-align:center}
.teleprompter{font-family:var(--n);font-weight:700;font-size:24px;line-height:1.4;text-align:center}
input.name{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="chip" title="连续打卡">🔥 <span id="tStreak">0</span></span>
    <span class="chip" title="星星">⭐ <span id="tStars">0</span></span>
    <span class="chip" title="经验">💎 <span id="tXp">0</span></span>
    <span class="sp"></span>
    <button class="chip" id="tSound">🔊</button>
  </div>
  <section id="vMap"></section>
  <section id="vFuture" hidden></section>
  <section id="vMe" hidden></section>
  <nav class="tabs">
    <button data-v="vMap" class="on"><i>🗺️</i>旅程</button>
    <button data-v="vFuture"><i>✨</i>30天后的我</button>
    <button data-v="vMe"><i>🎒</i>我的收藏</button>
  </nav>
</div>

<div class="ov" id="lesson" hidden><div class="in" id="lessonIn"></div></div>
<div class="ov" id="result" hidden><div class="in" id="resultIn"></div></div>
<div class="ov" id="intro" hidden><div class="in" id="introIn"></div></div>
<div class="sheet" id="sheet"><div class="card" id="sheetIn"></div></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

function quitLesson() { speechSynthesis && speechSynthesis.cancel(); if (recog) try { recog.abort(); } catch (e) {} $('#lesson').hidden = true; $('#lessonIn').innerHTML = ''; document.body.style.overflow = ''; renderMap(); }
function shell(coachMood, coachText, body) {

}
function coach(mood, text) { $('#coachM').innerHTML = mascot(mood, 76); if (text) $('#coachT').innerHTML = text; }
function next() { L.i++; if (L.i >= L.steps.length) finish(); else renderStep(); }
function gotIt(ok, el) {
  L.games++;
  if (ok) {
    L.right++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); L.xp += 2;
    if (L.combo >= 3) { sfx.combo(L.combo); praise(L.combo >= 5 ? '无敌连击 ×' + L.combo : '连击 ×' + L.combo); } else sfx.ok();

/* 学习 + 跟读 */
function speakBlock(text) {
  return `<div class="center" id="micBox"><button class="btn pink mic" id="mic">🎤</button><div class="miclabel" id="micL">${SR && !srBroken ? '按一下，跟我读' : canRecord ? '按一下录音，听听自己' : '大声读出来吧'}</div></div>`;
}
function wireMic(text, hostEl, onScore, opts = {}) {
  const mic = $('#mic'), lab = $('#micL');
  mic.onclick = async () => {
    if (mic.classList.contains('rec')) { if (recog) recog.stop(); if (mediaRec) mediaRec.stop(); return; }
    speechSynthesis && speechSynthesis.cancel();
    if (SR && !srBroken) {
      mic.classList.add('rec'); mic.textContent = '⏹'; lab.textContent = '我在听… 读完点一下'; coach('think', '我在认真听哦～');
      const r = await listen(text);
      mic.classList.remove('rec'); mic.textContent = '🎤'; lab.textContent = '再读一次';
      if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture', 'language-not-supported', 'start'].indexOf(r.err) >= 0) {
        srBroken = true; lab.textContent = canRecord ? '按一下录音，听听自己' : '大声读出来吧';
        toast(r.err === 'not-allowed' ? '麦克风没打开，先用自评模式' : '语音打分暂时连不上，先用自评模式'); return selfRate(onScore);
      }
      if (!r.text) {
        coach('think', '我好像没听到，大点声再来一次？'); sfx.no();
        if (!$('#selfOk')) $('#foot').insertAdjacentHTML('afterbegin', `<div class="center" style="margin-bottom:8px"><button class="btn" style="font-size:14px;padding:8px 14px" id="selfOk">我读完啦，自己打分</button></div>`);
        $('#selfOk').onclick = () => selfRate(onScore); return;
      }
      const sc = E.score(text, r.text); onScore(sc.score, sc.marks, r.text);
    } else if (canRecord) {
      try {
        mic.classList.add('rec'); mic.textContent = '⏹'; lab.textContent = '录音中… 读完点一下'; coach('think', '读完点一下停止，然后听听自己～');
        const url = await recordSelf(3500 + text.length * 90);
        mic.classList.remove('rec'); mic.textContent = '🎤'; lab.textContent = '再录一次';
        await speak(text, {}, hostEl); await new Promise(r => { const a = new Audio(url); a.onended = r; a.onerror = r; a.play().catch(r); });
        selfRate(onScore);
      } catch (e) { mic.classList.remove('rec'); mic.textContent = '🎤'; selfRate(onScore); }
    } else selfRate(onScore);
  };
}
function selfRate(onScore) {
  coach('happy', '和我读的比一比，你觉得怎么样？');
  $('#foot').innerHTML = `<div class="row"><button class="btn mint" style="flex:1" id="sr1">😊 读顺了</button><button class="btn yellow" style="flex:1" id="sr2">😅 还要练</button></div>`;

function stepLearn(st) {
  const it = st.item, isEx = st.text === it.ex, long = st.text.length > 28;
  shell(L.i === 0 ? 'cheer' : 'happy', L.i === 0 ? `第 ${L.id} 关开始啦！${esc(rnd(LEARN_TIPS))}` : esc(rnd(LEARN_TIPS)),
    `<span class="chip scene">📍 ${esc(it.scene)}</span>
    <div class="card"><div class="en ${long ? 'long' : ''}" id="tx">${wordsHtml(st.text)}</div><div class="zh">${esc(isEx ? it.exzh : it.zh)}</div>
      <div class="row" style="margin-top:14px"><button class="btn lilac play" id="p1">🔊</button><button class="btn play" id="p2">🐢</button><span class="small">点虚线单词看意思</span></div></div>
    ${isEx ? `<div class="ex"><span class="small">重点表达</span><div class="e">${esc(it.en)}</div><div class="small">${esc(it.zh)}</div></div>` : `<div class="ex"><span class="small">博主这样用 👇</span><div class="e" id="exl">${wordsHtml(it.ex)}</div><div class="small">${esc(it.exzh)}</div><button class="btn" style="font-size:14px;padding:6px 12px;margin-top:6px" id="p3">🔊 听例句</button></div>`}
    ${speakBlock(st.text)}`);
  const tx = $('#tx');
  $('#p1').onclick = () => speak(st.text, {}, tx);
  $('#p2').onclick = () => speak(st.text, { rate: .55 }, tx);
  if ($('#p3')) $('#p3').onclick = () => speak(it.ex, {}, $('#exl'));
  let best = 0, tries = 0;
  const skip = () => { $('#foot').innerHTML = `<div class="center"><button class="btn" style="font-size:14px;padding:8px 14px" id="skip">现在不方便开口，跳过</button></div>`; $('#skip').onclick = () => { L.speak.push(50); next(); }; };
  skip();
  wireMic(st.text, tx, (s, marks) => {
    tries++; S.speaks++; best = Math.max(best, s);
    if (marks) tx.innerHTML = wordsHtml(st.text, marks);
    const v = E.verdict(s);
    if (s >= 85) { S.perfect++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); burst(...centerOf($('#mic')), 34); sfx.win(); praise(v.title); L.xp += 3; }
    else if (s >= 60) { sfx.ok(); L.xp += 2; } else { sfx.pop(); L.xp += 1; }
    coach(s >= 85 ? 'love' : s >= 60 ? 'cheer' : 'happy', esc(rnd(v.say)) + (s < 60 ? ' 红色的词再听我读一遍～' : ''));
    save();
    $('#foot').innerHTML = `<div class="scorebox card" style="margin-bottom:12px"><div class="num">${s}</div><div><div class="t">${v.title}</div><div class="bigstars" style="font-size:24px;text-align:left;letter-spacing:2px">${[1, 2, 3].map(k => `<span class="${k <= v.tier ? '' : 'off'}" style="animation-delay:${k * .12}s">⭐</span>`).join('')}</div></div></div>
      <div class="row"><button class="btn" style="flex:1" id="again">🔁 再读</button><button class="btn mint" style="flex:1.4" id="nx">下一个 →</button></div>`;
    $('#again').onclick = () => { $('#mic').click(); };
    $('#nx').onclick = () => { L.speak.push(best); next(); };
  });
  setTimeout(() => speak(st.text, {}, tx), 350);
}

function stepBuild(st) {
  const hint = st.text === st.item.ex ? st.item.exzh : st.item.zh;
  shell('happy', '糖果拼句！按顺序点糖果，拼出这句话 🍬', `<div class="card"><div class="zh" style="margin:0 0 6px">「${esc(hint)}」</div><div class="slots" id="slots"></div></div><div class="pool" id="pool">${st.tiles.map((t, k) => `<button class="tile c${k % 6}" data-k="${k}">${esc(t.w)}</button>`).join('')}</div>`);
  const placed = [];
  const slots = $('#slots');
  function check() {
    if (placed.length < st.answer.length) return;
    const ok = placed.every((k, i) => E.norm(st.tiles[k].w) === E.norm(st.answer[i]));
    if (ok) {
      const ts = [...slots.children];
      ts.forEach((t, i) => setTimeout(() => { t.classList.add('boom'); burst(...centerOf(t), 10); sfx.pop(); }, i * 110));
      setTimeout(() => { slots.innerHTML = `<div class="en long" style="animation:pop .4s">${esc(st.text)}</div>`; speak(st.text); }, ts.length * 110 + 350);
      gotIt(true, null); coach('cheer', '消除成功！整句都拼对啦');
      footFeedback(true, rnd(RIGHT), esc(hint));
    } else {
      slots.classList.add('shake'); setTimeout(() => slots.classList.remove('shake'), 450);
      gotIt(false); coach('think', '顺序有点乱，看看正确的是哪样～');
      footFeedback(false, '正确顺序是：', `<b style="font-family:var(--n);font-size:18px">${esc(st.text)}</b>`);
      speak(st.text);
    }
  }
  document.querySelectorAll('#pool .tile').forEach(b => b.onclick = () => {
    if (b.classList.contains('used') || placed.length >= st.answer.length) return;
    b.classList.add('used'); placed.push(+b.dataset.k); sfx.pop();
    const c = document.createElement('button'); c.className = b.className.replace(' used', '').replace(' squish', ''); c.textContent = b.textContent; c.dataset.k = b.dataset.k; c.style.animation = 'pop .25s';
    c.onclick = () => { if ($('#foot').innerHTML) return; const k = +c.dataset.k; placed.splice(placed.indexOf(k), 1); c.remove(); b.classList.remove('used'); };
    slots.appendChild(c); check();
  });
}

/* 填空泡泡 */
function stepFill(st) {
  shell('happy', '泡泡填空！选一个词放进空格里 🫧', `<div class="card"><div class="en long nolook">${esc(st.before)}<span class="blank" id="bl">？</span>${esc(st.after)}</div><div class="zh">${esc(st.item.exzh)}</div></div><div class="pool">${st.options.map((o, i) => `<button class="tile c${(i * 2 + 1) % 6}" style="font-size:22px;padding:12px 20px" data-i="${i}">${esc(o)}</button>`).join('')}</div>`);
  let done = false;
  document.querySelectorAll('.pool .tile').forEach(b => b.onclick = () => {
    if (done) return; done = true;
    const ok = E.norm(st.options[+b.dataset.i]) === E.norm(st.answer);
    $('#bl').textContent = st.answer; $('#bl').style.animation = 'pop .35s';
    if (!ok) b.classList.add('shake');
    gotIt(ok, ok ? b : null); coach(ok ? 'cheer' : 'happy', ok ? rnd(RIGHT) : `答案是 <b>${esc(st.answer)}</b>，下次就记住啦`);
    speak(st.item.ex);
    footFeedback(ok, ok ? rnd(RIGHT) : '差一点！', `重点表达：<b>${esc(st.item.en)}</b> ${esc(st.item.zh)}`);
  });
}

/* 演技挑战 */
function stepAct(st) {
  const m = st.mood;
  shell('wow', `🎭 演技挑战！用「${m.e} ${esc(m.t)}」的语气读这句，越夸张越好～`, `<div class="card mood"><div class="e">${m.e}</div><div class="t">${esc(m.t)}</div></div><div class="card"><div class="en long" id="tx">${wordsHtml(st.text)}</div><div class="zh">${esc(st.text === st.item.ex ? st.item.exzh : st.item.zh)}</div><button class="btn lilac" style="margin-top:12px" id="demo">🔊 看糖豆示范</button></div>${speakBlock(st.text)}`);
  const tx = $('#tx');
  $('#demo').onclick = () => speak(st.text, { rate: m.rate, pitch: m.pitch, vol: m.vol }, tx);
  setTimeout(() => speak(st.text, { rate: m.rate, pitch: m.pitch, vol: m.vol }, tx), 400);
  $('#foot').innerHTML = `<div class="center"><button class="btn" style="font-size:14px;padding:8px 14px" id="skip">害羞，跳过这题</button></div>`;
  $('#skip').onclick = () => next();
  let acted = false;
  wireMic(st.text, tx, (s, marks) => {
    S.speaks++; save();
    if (acted) { if (marks) tx.innerHTML = wordsHtml(st.text, marks); coach('love', '再来一遍也很有戏！'); return; }
    acted = true; L.act = true; L.xp += 5;
    if (marks) tx.innerHTML = wordsHtml(st.text, marks);
    rain(); sfx.win(); praise(rnd(['影后级表演！', '戏精本精！', '奥斯卡欠你一座！']));
    coach('love', '哈哈哈太有戏了！演技挑战 +5 XP');
    L.speak.push(Math.max(s, 70));
    footFeedback(true, '🎬 表演满分！', `识别得分 ${s}，多加点戏，口语会越说越放松～`);
  });
}

/* 糖果消消乐 */
function stepMatch(st) {
  shell('wow', '🍬 糖果消消乐！把英文和中文配成一对，60 秒内全部消除！', `<div class="row" style="gap:8px"><span class="chip">⏱ <span id="sec">${st.seconds}</span></span><div class="timer" style="flex:1"><div id="tbar" style="width:100%"></div></div><span class="chip">💥 <span id="left">${st.items.length}</span></span></div>
  <div class="grid" id="grid">${st.tiles.map((t, k) => `<button class="gem ${t.lang} c${(t.k * 7 + (t.lang === 'en' ? 0 : 3)) % 6}" data-k="${k}">${esc(t.t)}</button>`).join('')}</div>`);
  let sel = null, left = st.items.length, miss = 0, streak = 0, sec = st.seconds, over = false;
  const tm = setInterval(() => { if (over || $('#lesson').hidden) return clearInterval(tm); sec--; $('#sec').textContent = sec; $('#tbar').style.width = sec / st.seconds * 100 + '%'; if (sec <= 10) sfx.tick(); if (sec <= 0) end(false); }, 1000);
  function end(cleared) {
    if (over) return; over = true; clearInterval(tm);
    const acc = st.items.length / (st.items.length + miss);
    L.games += 2; L.right += cleared ? Math.round(acc * 2) : 0;
    if (cleared) { rain(); sfx.win(); praise(sec > 30 ? '闪电消除！' : '全部消除！'); L.xp += 5 + Math.floor(sec / 10); coach('love', `全部消除！还剩 ${sec} 秒，奖励 +${5 + Math.floor(sec / 10)} XP`); }
    else { coach('happy', '时间到～剩下的已经帮你翻开了，看一眼记住它们'); document.querySelectorAll('.gem:not(.gone)').forEach(g => g.style.outline = '4px solid #ffd54f'); }
    footFeedback(cleared, cleared ? '🎉 消消乐通关！' : '时间到啦', cleared ? `失误 ${miss} 次${miss === 0 ? '，完美！' : ''}` : '下次一定能全部消掉！', next);
  }
  document.querySelectorAll('.gem').forEach(g => g.onclick = () => {
    if (over) return;
    const t = st.tiles[+g.dataset.k];
    if (t.lang === 'en') speak(t.t, { rate: 1 });
    if (!sel) { sel = g; g.classList.add('sel'); sfx.pop(); return; }
    if (sel === g) { g.classList.remove('sel'); sel = null; return; }
    const a = st.tiles[+sel.dataset.k];
    if (a.k === t.k && a.lang !== t.lang) {
      const s1 = sel; s1.classList.remove('sel'); s1.classList.add('gone'); g.classList.add('gone');
      burst(...centerOf(s1), 14); burst(...centerOf(g), 14); streak++; left--; $('#left').textContent = left;
      L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo);
      if (streak >= 2) { sfx.combo(streak); praise('连消 ×' + streak); } else sfx.ok();
      sel = null; if (!left) setTimeout(() => end(true), 450);
    } else {
      const s1 = sel; s1.classList.remove('sel'); [s1, g].forEach(x => { x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 420); });
      sfx.no(); miss++; streak = 0; L.combo = 0; sel = null;
    }
  });
}

/* ---------- 结算 ---------- */
function finish() {
  const avg = L.speak.length ? L.speak.reduce((a, b) => a + b, 0) / L.speak.length : 60;
  const acc = L.games ? L.right / L.games : 1;
  const stars = E.starsFor(avg, acc);
  E.addXp(S, L.xp);
  const gain = E.finishLevel(S, L.id, stars, { combo: L.maxCombo, act: L.act });
  save();
  $('#lesson').hidden = true; $('#lessonIn').innerHTML = ''; $('#result').hidden = false;
  const lv = L.lv, stg = C.STAGES[lv.stage];
  let h = `<div class="center" style="margin-top:10px">${mascot('cheer', 130)}</div>
  <div class="center disp" style="font-size:34px;margin:4px 0">第 ${L.id} 关 通关！</div>
  <div class="bigstars">${[1, 2, 3].map(k => `<span class="${k <= stars ? '' : 'off'}" style="animation-delay:${.2 + k * .25}s">⭐</span>`).join('')}</div>
  <div class="card stats" style="margin-top:14px"><div><b>+${gain.xp + L.xp}</b><span class="small">经验</span></div><div><b>${Math.round(avg)}</b><span class="small">口语均分</span></div><div><b>${L.maxCombo}</b><span class="small">最高连击</span></div></div>`;
  if (gain.sticker) h += `<div class="card gain" style="margin-top:14px;animation-delay:1s;background:#fff3c9"><div class="e">${gain.sticker.e}</div><div><b class="disp" style="font-size:20px;font-weight:400">护照盖章：${esc(gain.sticker.t)}！</b><div style="font-size:14px;margin-top:2px">🔓 新能力解锁：<b>${esc(gain.ability.unlock)}</b></div><div class="small">${esc(gain.ability.detail)}</div></div></div>`;
  gain.badges.forEach((b, i) => h += `<div class="card gain" style="margin-top:10px;animation-delay:${1.2 + i * .2}s"><div class="e">${b.e}</div><div><b>新徽章：${b.t}</b><div class="small">${b.d}</div></div></div>`);
  h += `<div class="card" style="margin-top:12px;font-size:14px;line-height:1.7"><b>🥠 今日小技巧：${esc(lv.tip.t)}</b><br>${esc(lv.tip.b)}</div>
  <div class="card center" style="margin-top:12px"><canvas id="share" width="750" height="1000" style="width:100%;border-radius:16px"></canvas><div class="small" style="margin:8px 0">长按图片保存，发朋友圈打卡 ✨</div></div>
  <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" id="rAgain">🔁 再玩一次</button><button class="btn pink" style="flex:1.4" id="rNext">${L.id >= 30 ? '🎬 去拍封面大片' : '下一关 →'}</button></div>`;
  $('#resultIn').innerHTML = h;
  drawShare($('#share'), L.id, stars, stg);
  setTimeout(() => { rain(); sfx.win(); }, 300);
  const id = L.id;
  $('#rAgain').onclick = () => { $('#result').hidden = true; startLesson(id); };
  $('#rNext').onclick = () => { $('#result').hidden = true; document.body.style.overflow = ''; if (id >= 30) openGrad(); else startLesson(id + 1); };
  renderTop();
}

/* ---------- 画图：打卡图 / 封面大片 ---------- */
function svgImg(svg) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const FD = "'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif", FN = "'Baloo 2','PingFang SC',sans-serif";
async function drawShare(cv, id, stars, stg) {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height;
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ffc2dc'); g.addColorStop(.55, '#ffe6d1'); g.addColorStop(1, '#dff3ff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = '#ffffff99'; [[120, 140, 60], [640, 220, 80], [90, 820, 70], [680, 900, 50]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); });
  const m = await svgImg(mascot('cheer', 300)); if (m) c.drawImage(m, W / 2 - 150, 120, 300, 300);
  c.textAlign = 'center'; c.fillStyle = '#4a2c45';
  c.font = `64px ${FD}`; c.fillText(`口语糖果岛 · 第 ${id} 关`, W / 2, 500);
  c.font = `110px ${FN}`; c.fillStyle = '#ffb800'; c.fillText('★'.repeat(stars) + '☆'.repeat(3 - stars), W / 2, 640);
  c.fillStyle = '#4a2c45'; c.font = `40px ${FD}`; c.fillText(`${stg.icon} ${stg.name}`, W / 2, 720);
  c.font = `34px ${FD}`; c.fillText(`连续打卡 ${E.streakAlive(S)} 天 · 已通关 ${E.doneCount(S)}/30`, W / 2, 790);
  rr(c, 70, 840, W - 140, 100, 30); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 5; c.strokeStyle = '#4a2c45'; c.stroke();
  c.fillStyle = '#e0558f'; c.font = `36px ${FD}`; c.fillText('每天 10 分钟，30 天后开口说英语', W / 2, 903);
}
async function drawCover(cv, name, photo, real) {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height;
  if (photo) {
    const s = Math.max(W / photo.width, H / photo.height); c.drawImage(photo, (W - photo.width * s) / 2, (H - photo.height * s) / 2, photo.width * s, photo.height * s);
  } else {
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#ffb3d1'); g.addColorStop(.5, '#ffd9c2'); g.addColorStop(1, '#c9b8ff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const m = await svgImg(mascot('love', 560)); if (m) c.drawImage(m, W / 2 - 280, 300, 560, 560);
  }
  const sh = c.createLinearGradient(0, H * .45, 0, H); sh.addColorStop(0, '#0000'); sh.addColorStop(1, '#000a'); c.fillStyle = sh; c.fillRect(0, 0, W, H);
  const top = c.createLinearGradient(0, 0, 0, 260); top.addColorStop(0, '#0006'); top.addColorStop(1, '#0000'); c.fillStyle = top; c.fillRect(0, 0, W, 260);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `800 150px ${FN}`; c.fillText('SHE SPEAKS', W / 2, 160);
  c.font = `600 28px ${FN}`; c.fillText('THE MAIN CHARACTER ISSUE  ·  NO.30', W / 2, 210);
  c.textAlign = 'left'; c.font = `34px ${FD}`;
  [['本期封面人物', 300], ['200 句博主同款口语', 360], ['5 座城市护照印章', 410]].forEach(([t, y], i) => { c.fillStyle = i ? '#fff' : '#ffd54f'; c.fillText(t, 50, y); });
  c.textAlign = 'center'; c.fillStyle = '#ffd54f'; c.font = `800 120px ${FN}`; c.fillText(name, W / 2, H - 250);
  c.fillStyle = '#fff'; c.font = `48px ${FD}`; c.fillText('30 天，我开口说英语了', W / 2, H - 170);
  c.font = `30px ${FD}`; c.fillText(real ? `${E.totalStars(S)} 颗星 · ${S.speaks} 次开口 · 第一条英文 vlog 已录制` : '这里会是你的照片和名字', W / 2, H - 110);
  c.font = `600 24px ${FN}`; c.fillStyle = '#ffffffcc'; c.fillText('CANDY ISLAND ENGLISH', W / 2, H - 50);
}

/* ---------- 毕业：录 vlog 开场 + 封面大片 ---------- */
function openGrad() {
  $('#intro').hidden = false; document.body.style.overflow = 'hidden';
  let i = 0; const scores = [];
  function line() {
    if (i >= C.GRAD.length) return cover();
    const t = C.GRAD[i];
    $('#introIn').innerHTML = `<div class="lhead"><button class="x" id="gx">✕</button><div class="pbar"><div style="width:${i / C.GRAD.length * 100}%"></div></div><span class="chip">🎬 ${i + 1}/6</span></div>
    <div class="coach"><div class="m bob" id="coachM">${mascot('wow', 76)}</div><div class="bubble" id="coachT">主角时刻！这是你的第一条英文 vlog 开场，对着镜头读出来 🎥</div></div>
    <div class="card" style="background:#2b2140;color:#fff;border-color:#2b2140;box-shadow:0 6px 0 #000"><div class="small" style="color:#ffb3d1">● REC 提词器</div><div class="teleprompter" id="tx" style="margin:16px 0">${wordsHtml(t)}</div><div class="center" style="opacity:.8">${esc(C.GRADZH[i])}</div></div>
    <div class="row" style="justify-content:center"><button class="btn lilac" id="p1">🔊 听一遍</button></div>${speakBlock(t)}<div class="foot" id="foot"></div>`;
    $('#gx').onclick = () => { $('#intro').hidden = true; document.body.style.overflow = ''; };
    $('#p1').onclick = () => speak(t, {}, $('#tx'));
    setTimeout(() => speak(t, {}, $('#tx')), 300);
    wireMic(t, $('#tx'), (s, marks) => {
      if (marks) $('#tx').innerHTML = wordsHtml(t, marks);
      scores.push(s); S.speaks++; save(); burst(...centerOf($('#mic')), 26); sfx.ok();
      coach('love', s >= 80 ? '这条可以直接发！' : '镜头感满满～');
      $('#foot').innerHTML = `<button class="btn mint wide" id="nx">${i < 5 ? '下一句 →' : '🎬 杀青！生成封面'}</button>`;
      $('#nx').onclick = () => { i++; line(); };
    });
  }
  function cover() {
    S.grad = true; save();
    $('#introIn').innerHTML = `<div class="center disp" style="font-size:30px;margin-top:10px">🎉 恭喜杀青！</div><div class="center small" style="margin-bottom:12px">放上你的照片，生成本期封面人物</div>
    <div class="coverwrap"><canvas id="cv" width="900" height="1200"></canvas></div>
    <div class="card" style="margin-top:14px"><input class="name" id="nm2" maxlength="12" placeholder="你的名字（英文名更有感觉）" value="${esc(S.name)}">
    <div class="row" style="margin-top:12px"><label class="btn lilac" style="flex:1">📷 换成我的照片<input type="file" accept="image/*" id="ph" hidden></label><button class="btn pink" style="flex:1" id="dl">⬇️ 保存封面</button></div>
    <div class="small" style="margin-top:8px">照片只在你的手机里生成，不会上传</div></div>
    <button class="btn wide" style="margin-top:14px" id="gdone">回到旅程</button>`;
    let photo = null; const cv = $('#cv');
    const redraw = () => drawCover(cv, S.name || 'YOU', photo, true);
    redraw(); rain(); sfx.win();
    $('#nm2').oninput = e => { S.name = e.target.value.trim(); save(); redraw(); };
    $('#ph').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { photo = img; redraw(); }; img.src = URL.createObjectURL(f); };
    $('#dl').onclick = () => { const a = document.createElement('a'); a.download = 'SHE-SPEAKS-封面.png'; a.href = cv.toDataURL('image/png'); a.click(); toast('已保存，手机上也可以长按图片保存'); };
    $('#gdone').onclick = () => { $('#intro').hidden = true; document.body.style.overflow = ''; renderMap(); };
  }
  line();
}

/* ---------- 首次打开 ---------- */
function intro() {
  $('#intro').hidden = false; document.body.style.overflow = 'hidden';
  $('#introIn').innerHTML = `<div class="center" style="margin-top:20px">${mascot('cheer', 150)}</div>
  <div class="center disp" style="font-size:32px;line-height:1.3">嗨！我是糖豆 👋<br>欢迎来到口语糖果岛</div>
  <div class="card" style="margin-top:16px;font-size:15px;line-height:1.8">接下来 30 天，我们一起从 <b>巴黎咖啡馆</b> 出发，经过 <b>纽约、东京、伦敦</b>，最后到达 <b>主角时刻</b> 🎬<br>每天 10 分钟，边玩边学 200 句油管博主天天在说的地道口语。<br>终点，你会录下自己的第一条英文 vlog，还会得到一张 <b>专属杂志封面</b> ✨</div>
  <div class="card" style="margin-top:14px"><div class="disp" style="font-size:18px;margin-bottom:8px">先告诉我，你叫什么？</div><input class="name" id="nm0" maxlength="12" placeholder="比如 Lily（会印在你的封面上）"></div>
  <button class="btn pink wide" style="margin-top:18px;font-size:22px" id="go0">出发！去巴黎 🥐</button>
  <div class="small center" style="margin-top:10px">建议戴耳机，在安静的地方开口跟读</div>`;
  $('#go0').onclick = () => { S.name = $('#nm0').value.trim(); S.intro = true; save(); $('#intro').hidden = true; document.body.style.overflow = ''; sfx.win(); renderMap(); };
}

renderMap();
if (!S.intro) intro();
</script>
