<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(170deg,#ffd9e8 0%,#ffeef5 45%,#fff3d1 100%);font-family:'ZCOOL KuaiLe','WenQuanYi Zen Hei',sans-serif;color:#4a2c45;position:relative}
.blob{position:absolute;border-radius:50%;opacity:.55;filter:blur(2px)}
#tag{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#4a2c45;color:#fff;font-size:38px;padding:10px 34px;border-radius:60px;white-space:nowrap;box-shadow:0 6px 0 #ff5c93}
#hook{position:absolute;top:140px;left:40px;right:40px;text-align:center;font-size:76px;line-height:1.22;letter-spacing:1px;-webkit-text-stroke:0;text-shadow:0 4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 -4px 0 #fff}
#hook em{font-style:normal;color:#ff3d7f}
#hook .en{font-family:'Baloo 2',sans-serif;font-weight:800}
#phone{position:absolute;left:228px;top:362px;width:652px;height:1378px;border:14px solid #4a2c45;border-radius:74px;overflow:hidden;background:#fff;box-shadow:0 18px 0 rgba(74,44,69,.18)}
#phone iframe{width:390px;height:844px;border:0;transform:scale(1.6);transform-origin:0 0;display:block}
#cap{position:absolute;left:40px;right:40px;top:1760px;height:130px;display:flex;align-items:center;gap:18px;background:#fff;border:6px solid #4a2c45;border-radius:40px;padding:0 30px 0 14px;box-shadow:0 8px 0 #ff5c93;transition:transform .25s}
#cap.pop{transform:scale(1.04)}
#cap .m{flex:none;margin-top:-40px}
#capT{font-size:50px;line-height:1.15}
#capT em{font-style:normal;color:#ff3d7f}
#side{position:absolute;top:400px;width:200px;font-size:96px;text-align:center}
#end{position:absolute;inset:0;background:linear-gradient(170deg,#ff7eb3,#ffb38a 60%,#ffd54f);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:26px}
#end.on{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:scale(1.05)}to{opacity:1}}
#end .big{font-size:140px;line-height:1;text-shadow:0 8px 0 #c2306a}
#end .price{background:#fff;color:#ff3d7f;border-radius:40px;padding:18px 50px;font-size:74px;box-shadow:0 10px 0 #c2306a}
#end .price b{font-family:'Baloo 2';font-size:120px;font-weight:800}
#end .l{font-size:58px}
#end .s{font-size:44px;opacity:.95;background:rgba(74,44,69,.25);padding:14px 36px;border-radius:30px}
</style></head><body>
<div class="blob" style="width:340px;height:340px;background:#ffb3d1;left:-120px;top:520px"></div>
<div class="blob" style="width:260px;height:260px;background:#ffe08a;right:-90px;top:900px"></div>
<div class="blob" style="width:200px;height:200px;background:#c9b6ff;left:-60px;top:1350px"></div>
<div id="tag"></div>
<div id="hook"></div>
<div id="side" style="left:4px">🍬</div><div id="side2" style="position:absolute;top:1180px;right:6px;font-size:90px">⭐</div>
<div id="phone"><iframe id="app"></iframe></div>
<div id="cap"><div class="m" id="capM"></div><div id="capT"></div></div>
<div id="end"><div id="endM"></div><div class="big">口语糖果岛</div><div class="l">30 关 · 200 句油管博主地道口语</div><div class="price"><b>9.9</b> 元 一次买断</div><div class="l">前 3 关免费试玩 · 永久使用</div><div class="s">评论区扣「糖果」我发你试玩链接</div></div>
<script src="../../src/core/mascot.js"></script>
<script>
function set(o){
  if(o.tag!=null)document.getElementById('tag').innerHTML=o.tag;
  if(o.hook!=null)document.getElementById('hook').innerHTML=o.hook;
  if(o.cap!=null){const c=document.getElementById('cap');document.getElementById('capT').innerHTML=o.cap;document.getElementById('capM').innerHTML=mascot(o.mood||'cheer',150);c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),250)}
  if(o.end){document.getElementById('endM').innerHTML=mascot('love',300);document.getElementById('end').classList.add('on')}
  if(o.endOff)document.getElementById('end').classList.remove('on');
}
</script></body></html>
